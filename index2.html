<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mogano List · 每日待办清单</title>
  <script src="https://resource-static.cdn.bcebos.com/common/tailwindcss/3.4.16.js"></script>
  <script>
    tailwind.config = {
      theme: {
        container: { center: true, padding: '1.5rem', screens: { '2xl': '1080px' } },
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
            secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
            muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
            accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
            danger: { DEFAULT: 'hsl(var(--danger))', foreground: 'hsl(var(--danger-foreground))' },
            card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' }
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Microsoft YaHei"', '"Helvetica Neue"', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    /* ===== FONT-FACE:BEGIN ===== */
    /* ===== FONT-FACE:END ===== */

    /* ===== DESIGN-TOKENS:BEGIN ===== */
    :root {
      --radius: 0.75rem;
      --background: 110 32% 95%;
      --foreground: 152 24% 14%;
      --card: 0 0% 100%;
      --card-foreground: 152 24% 14%;
      --primary: 152 36% 26%;
      --primary-foreground: 110 40% 96%;
      --secondary: 110 24% 91%;
      --secondary-foreground: 152 24% 14%;
      --muted: 110 22% 92%;
      --muted-foreground: 150 12% 36%;
      --accent: 98 50% 86%;
      --accent-foreground: 152 24% 14%;
      --border: 122 18% 84%;
      --input: 122 18% 84%;
      --ring: 152 36% 26%;
      --danger: 355 62% 40%;
      --danger-foreground: 0 0% 100%;
      --tag-work: 212 66% 40%;
      --tag-life: 158 44% 28%;
      --tag-study: 264 50% 44%;
      --tag-health: 22 74% 38%;
      --tag-other: 210 8% 36%;
    }
    /* ===== DESIGN-TOKENS:END ===== */

    /* ===== APP-CSS:BEGIN ===== */
    html {
      scroll-behavior: smooth;
      background-color: hsl(var(--background));
      background-image: url("assets/landscape-green.jpg");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    body {
      background: transparent;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(180deg,
        hsl(var(--background) / .62) 0%,
        hsl(var(--background) / .84) 42%,
        hsl(var(--background) / .93) 100%);
    }
    .glass {
      background-color: hsl(var(--card) / .82);
      -webkit-backdrop-filter: blur(10px) saturate(1.04);
      backdrop-filter: blur(10px) saturate(1.04);
    }
    .glass-soft {
      background-color: hsl(var(--card) / .66);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-width: 1px;
      border-style: solid;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge-work { background-color: hsl(var(--tag-work) / .13); border-color: hsl(var(--tag-work) / .32); color: hsl(var(--tag-work)); }
    .badge-life { background-color: hsl(var(--tag-life) / .13); border-color: hsl(var(--tag-life) / .32); color: hsl(var(--tag-life)); }
    .badge-study { background-color: hsl(var(--tag-study) / .13); border-color: hsl(var(--tag-study) / .32); color: hsl(var(--tag-study)); }
    .badge-health { background-color: hsl(var(--tag-health) / .13); border-color: hsl(var(--tag-health) / .32); color: hsl(var(--tag-health)); }
    .badge-other { background-color: hsl(var(--tag-other) / .12); border-color: hsl(var(--tag-other) / .3); color: hsl(var(--tag-other)); }
    .cat-chip.badge { background-color: transparent; }
    .cat-chip.badge-work { background-color: hsl(var(--tag-work) / .2); }
    .cat-chip.badge-life { background-color: hsl(var(--tag-life) / .2); }
    .cat-chip.badge-study { background-color: hsl(var(--tag-study) / .2); }
    .cat-chip.badge-health { background-color: hsl(var(--tag-health) / .2); }
    .cat-chip.badge-other { background-color: hsl(var(--tag-other) / .16); }
    .task-item { animation: rise .28s ease-out both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .task-item.removing { animation: fade .18s ease-in forwards; }
    @keyframes fade { to { opacity: 0; transform: translateX(8px); } }
    .task-text { transition: color .2s ease, text-decoration-color .2s ease; }
    .done .task-text { text-decoration: line-through; text-decoration-thickness: 1px; }
    .toggle-mark { transition: background-color .18s ease, border-color .18s ease, transform .12s ease; }
    .toggle-mark:active { transform: scale(.9); }
    .progress-fill { transition: width .32s ease-out; }
    .field:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
    .drag { touch-action: none; cursor: grab; }
    .drag:active { cursor: grabbing; }
    .task-item.dragging { opacity: .35; pointer-events: none; }
    .drag-ghost {
      position: fixed;
      z-index: 60;
      pointer-events: none;
      border-radius: var(--radius);
      background: hsl(var(--card));
      box-shadow: 0 10px 26px hsl(var(--foreground) / .16);
    }
    body.is-sorting { user-select: none; }
    ::selection { background: hsl(var(--accent)); }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
    /* ===== APP-CSS:END ===== */
  </style>
</head>
<body class="text-foreground antialiased min-h-screen flex flex-col">

  <header id="site-header" class="glass-soft border-b border-border">
    <div class="container flex items-center justify-between gap-4 py-4">
      <div class="flex items-center gap-3">
        <span class="grid place-items-center h-9 w-9 rounded-md bg-primary text-primary-foreground font-semibold text-sm tracking-tight">M</span>
        <div class="leading-tight">
          <p class="text-base font-semibold tracking-tight">Mogano List</p>
          <p class="text-xs text-muted-foreground">每天要做什么，记在这里</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="prev-day" type="button" aria-label="前一天"
                class="field h-9 w-9 grid place-items-center rounded-md border border-border text-muted-foreground hover:bg-secondary hover:text-foreground">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="today-jump" type="button"
                class="field h-9 px-3 rounded-md border border-border text-sm text-foreground hover:bg-secondary">今天</button>
        <button id="next-day" type="button" aria-label="后一天"
                class="field h-9 w-9 grid place-items-center rounded-md border border-border text-muted-foreground hover:bg-secondary hover:text-foreground">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1">
    <section id="day-overview" class="container pt-10 pb-6">
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6">
        <div>
          <p id="day-relative" class="text-xs font-medium tracking-widest uppercase text-muted-foreground">今天</p>
          <h1 id="day-title" class="mt-2 text-3xl md:text-4xl font-semibold tracking-tight">11 月 10 日</h1>
          <p id="day-weekday" class="mt-1.5 text-sm text-muted-foreground">星期一</p>
        </div>

        <div class="w-full md:w-64">
          <div class="flex items-baseline justify-between text-sm">
            <span class="text-muted-foreground">完成进度</span>
            <span class="tabular-nums font-medium"><span id="done-count">0</span> / <span id="total-count">0</span></span>
          </div>
          <div class="mt-2 h-2 w-full rounded-full bg-secondary overflow-hidden">
            <div id="progress-fill" class="progress-fill h-full rounded-full bg-primary" style="width: 0%"></div>
          </div>
          <p id="progress-hint" class="mt-2 text-xs text-muted-foreground">还没有待办，先写一条吧</p>
        </div>
      </div>
    </section>

    <section id="task-board" class="container pb-14">
      <div class="glass rounded-lg border border-border shadow-sm">
        <div class="p-4 md:p-5 border-b border-border">
          <form id="add-form" class="flex flex-col md:flex-row md:items-center gap-2" autocomplete="off">
            <input id="task-input" type="text" maxlength="120" placeholder="写下一件今天要做的事…"
                   class="field flex-1 h-11 rounded-md border border-input bg-background px-3 text-sm placeholder:text-muted-foreground" />
            <div class="flex items-center gap-2">
              <label for="cat-input" class="sr-only">分类</label>
              <select id="cat-input" aria-label="分类"
                      class="field h-11 shrink-0 rounded-md border border-input bg-background px-2 text-sm text-foreground">
                <option value="work">工作</option>
                <option value="life" selected>生活</option>
                <option value="study">学习</option>
                <option value="health">健康</option>
                <option value="other">其他</option>
              </select>
              <label for="due-input" class="field flex items-center gap-1.5 h-11 shrink-0 rounded-md border border-input bg-background px-2.5 text-xs text-muted-foreground">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
                <span class="hidden md:inline">截止</span>
                <input id="due-input" type="date" class="field h-7 rounded-sm border border-input bg-background px-1.5 text-xs text-foreground" aria-label="截止日期" />
              </label>
              <button type="submit"
                      class="field h-11 px-4 rounded-md bg-primary text-primary-foreground text-sm font-medium hover:opacity-90">添加</button>
            </div>
          </form>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 px-4 md:px-5 py-3 border-b border-border">
          <div id="filters" class="flex items-center gap-1" role="tablist" aria-label="筛选待办">
            <button type="button" data-filter="all" class="filter-btn field h-8 px-3 rounded-md text-sm">全部</button>
            <button type="button" data-filter="active" class="filter-btn field h-8 px-3 rounded-md text-sm">进行中</button>
            <button type="button" data-filter="done" class="filter-btn field h-8 px-3 rounded-md text-sm">已完成</button>
          </div>
          <div class="flex items-center gap-1.5">
            <button id="complete-all" type="button"
                    class="field inline-flex items-center gap-1 h-8 px-2.5 rounded-md border border-border text-xs font-medium text-foreground hover:bg-secondary">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12l4.5 4.5L15 8"/><path d="M11 16.5L13 18.5L22 8"/></svg>
              一键完成
            </button>
            <button id="clear-done" type="button"
                    class="field h-8 px-2.5 rounded-md text-xs text-muted-foreground hover:bg-secondary hover:text-foreground">清除已完成</button>
          </div>
        </div>

        <div id="cat-filters" class="flex flex-wrap items-center gap-1.5 px-4 md:px-5 py-2.5 border-b border-border"></div>

        <ul id="task-list" class="divide-y divide-border"></ul>

        <div id="empty-state" class="hidden px-6 py-14 text-center">
          <svg class="mx-auto text-muted-foreground" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="3.5" width="16" height="17" rx="2.5"/>
            <path d="M8 8.5h5M8 12h8M8 15.5h6"/>
          </svg>
          <p id="empty-title" class="mt-4 text-sm font-medium">今天还没有待办</p>
          <p id="empty-desc" class="mt-1 text-xs text-muted-foreground">在上面的输入框写一条，按回车就能添加</p>
        </div>
      </div>

      <p class="mt-3 text-xs text-muted-foreground">数据保存在你自己的浏览器里，换设备不会同步。</p>
    </section>
  </main>

  <footer id="site-footer" class="glass-soft border-t border-border">
    <div class="container py-5 flex flex-col md:flex-row md:items-center justify-between gap-2">
      <p class="text-xs text-muted-foreground">Mogano List · 一个不打扰你的每日清单</p>
      <p class="text-xs text-muted-foreground">拖动左侧圆点调整顺序 · 双击文字直接修改 · 点分类徽章可按该分类筛选</p>
    </div>
  </footer>

  <template id="task-template">
    <li class="task-item group flex items-start gap-3 px-4 md:px-5 py-3.5">
      <button type="button" class="drag field mt-0.5 h-5 w-4 shrink-0 grid place-items-center text-muted-foreground hover:text-foreground" aria-label="拖动调整顺序（也可用上下方向键）" title="拖动调整顺序">
        <svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.5"/><circle cx="7" cy="3" r="1.5"/><circle cx="3" cy="8" r="1.5"/><circle cx="7" cy="8" r="1.5"/><circle cx="3" cy="13" r="1.5"/><circle cx="7" cy="13" r="1.5"/></svg>
      </button>
      <button type="button" class="toggle field toggle-mark mt-0.5 h-5 w-5 shrink-0 rounded-full border grid place-items-center" aria-label="标记完成">
        <svg class="check-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
      <div class="min-w-0 flex-1">
        <p class="task-text text-sm leading-6 break-words"></p>
        <div class="task-meta mt-1 flex flex-wrap items-center gap-1.5"></div>
      </div>
      <div class="flex items-center gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 focus-within:opacity-100 transition-opacity">
        <button type="button" class="tag-btn field h-7 w-7 grid place-items-center rounded-md text-muted-foreground hover:bg-secondary hover:text-foreground" aria-label="修改分类">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>
        </button>
        <button type="button" class="due-btn field h-7 w-7 grid place-items-center rounded-md text-muted-foreground hover:bg-secondary hover:text-foreground" aria-label="设置截止日期">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
        </button>
        <button type="button" class="edit field h-7 w-7 grid place-items-center rounded-md text-muted-foreground hover:bg-secondary hover:text-foreground" aria-label="编辑">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button type="button" class="remove field h-7 w-7 grid place-items-center rounded-md text-muted-foreground hover:bg-secondary hover:text-foreground" aria-label="删除">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>
    </li>
  </template>

  <!-- ===== APP-JS:BEGIN ===== -->
  <script>
    (function () {
      'use strict';

      var STORE_KEY = 'mogano-list-v1';
      var WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      var CATS = [
        { id: 'work', label: '工作' },
        { id: 'life', label: '生活' },
        { id: 'study', label: '学习' },
        { id: 'health', label: '健康' },
        { id: 'other', label: '其他' }
      ];

      var state = {
        date: toKey(new Date()),
        filter: 'all',
        cat: 'all'
      };

      var el = {
        dayRelative: document.getElementById('day-relative'),
        dayTitle: document.getElementById('day-title'),
        dayWeekday: document.getElementById('day-weekday'),
        doneCount: document.getElementById('done-count'),
        totalCount: document.getElementById('total-count'),
        progressFill: document.getElementById('progress-fill'),
        progressHint: document.getElementById('progress-hint'),
        form: document.getElementById('add-form'),
        input: document.getElementById('task-input'),
        dueInput: document.getElementById('due-input'),
        catInput: document.getElementById('cat-input'),
        catFilters: document.getElementById('cat-filters'),
        list: document.getElementById('task-list'),
        empty: document.getElementById('empty-state'),
        emptyTitle: document.getElementById('empty-title'),
        emptyDesc: document.getElementById('empty-desc'),
        clearDone: document.getElementById('clear-done'),
        completeAll: document.getElementById('complete-all'),
        filters: document.getElementById('filters'),
        template: document.getElementById('task-template'),
        prevDay: document.getElementById('prev-day'),
        nextDay: document.getElementById('next-day'),
        todayJump: document.getElementById('today-jump')
      };

      function toKey(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      function fromKey(key) {
        var parts = key.split('-').map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      function readStore() {
        try {
          var raw = localStorage.getItem(STORE_KEY);
          var data = raw ? JSON.parse(raw) : {};
          return data && typeof data === 'object' ? data : {};
        } catch (e) {
          return {};
        }
      }

      function writeStore(data) {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(data));
        } catch (e) {
          /* 存储不可用时功能仍可继续使用，只是不持久化 */
        }
      }

      function tasksOf(key) {
        var data = readStore();
        var list = data[key];
        return Array.isArray(list) ? list : [];
      }

      function saveTasks(key, list) {
        var data = readStore();
        if (list.length) {
          data[key] = list;
        } else {
          delete data[key];
        }
        writeStore(data);
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function visibleTasks(list) {
        var out = list;
        if (state.filter === 'active') out = out.filter(function (t) { return !t.done; });
        if (state.filter === 'done') out = out.filter(function (t) { return t.done; });
        if (state.cat !== 'all') out = out.filter(function (t) { return t.cat === state.cat; });
        return out;
      }

      function catLabel(id) {
        for (var i = 0; i < CATS.length; i++) {
          if (CATS[i].id === id) return CATS[i].label;
        }
        return '未分类';
      }

      function catClass(id) {
        var known = CATS.some(function (c) { return c.id === id; });
        return 'badge-' + (known ? id : 'other');
      }

      function renderCatFilters(list) {
        el.catFilters.innerHTML = '';
        var defs = [{ id: 'all', label: '全部分类', count: list.length }].concat(CATS.map(function (c) {
          return {
            id: c.id,
            label: c.label,
            count: list.filter(function (t) { return t.cat === c.id; }).length
          };
        }));

        defs.forEach(function (d) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.dataset.cat = d.id;
          chip.className = 'field cat-chip inline-flex items-center gap-1 h-7 rounded-full border px-2.5 text-xs transition-colors';
          if (state.cat === d.id) {
            chip.classList.add('font-medium');
            if (d.id === 'all') {
              chip.classList.add('border-primary', 'bg-primary', 'text-primary-foreground');
            } else {
              chip.classList.add('badge', catClass(d.id));
            }
          } else {
            chip.classList.add('border-border', 'text-muted-foreground', 'hover:bg-secondary');
          }
          chip.textContent = d.label;

          var num = document.createElement('span');
          num.className = 'tabular-nums opacity-70';
          num.textContent = String(d.count);
          chip.appendChild(num);

          el.catFilters.appendChild(chip);
        });
      }

      function renderDate() {
        var d = fromKey(state.date);
        var todayKey = toKey(new Date());
        var diffDays = Math.round((fromKey(state.date) - fromKey(todayKey)) / 86400000);
        var relative = '今天';
        if (diffDays === -1) relative = '昨天';
        else if (diffDays === 1) relative = '明天';
        else if (diffDays < -1) relative = Math.abs(diffDays) + ' 天前';
        else if (diffDays > 1) relative = diffDays + ' 天后';

        el.dayRelative.textContent = relative;
        el.dayTitle.textContent = (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
        el.dayWeekday.textContent = WEEKDAYS[d.getDay()] + ' · ' + state.date;
      }

      function dueLabel(key) {
        var d = fromKey(key);
        var diff = Math.round((fromKey(key) - fromKey(toKey(new Date()))) / 86400000);
        if (diff === 0) return '今天';
        if (diff === 1) return '明天';
        if (diff === -1) return '昨天';
        return (d.getMonth() + 1) + '月' + d.getDate() + '日';
      }

      function dueTone(task) {
        if (!task.due) return 'none';
        if (task.done) return 'done';
        var todayKey = toKey(new Date());
        if (task.due < todayKey) return 'overdue';
        if (task.due === todayKey) return 'today';
        return 'future';
      }

      function renderProgress(list) {
        var total = list.length;
        var done = list.filter(function (t) { return t.done; }).length;
        var overdue = list.filter(function (t) { return !t.done && t.due && t.due < toKey(new Date()); }).length;
        var pct = total ? Math.round((done / total) * 100) : 0;

        el.doneCount.textContent = String(done);
        el.totalCount.textContent = String(total);
        el.progressFill.style.width = pct + '%';

        if (!total) {
          el.progressHint.textContent = '还没有待办，先写一条吧';
        } else if (done === total) {
          el.progressHint.textContent = '全部完成，今天很利落。';
        } else if (overdue > 0) {
          el.progressHint.textContent = '还剩 ' + (total - done) + ' 件待办，其中 ' + overdue + ' 件已逾期';
        } else {
          el.progressHint.textContent = '还剩 ' + (total - done) + ' 件待办';
        }
      }

      function renderFilters() {
        var buttons = el.filters.querySelectorAll('.filter-btn');
        for (var i = 0; i < buttons.length; i++) {
          var btn = buttons[i];
          var active = btn.getAttribute('data-filter') === state.filter;
          btn.classList.toggle('bg-primary', active);
          btn.classList.toggle('text-primary-foreground', active);
          btn.classList.toggle('font-medium', active);
          btn.classList.toggle('text-muted-foreground', !active);
          btn.classList.toggle('hover:bg-secondary', !active);
          btn.setAttribute('aria-selected', String(active));
        }
      }

      function render() {
        renderDate();
        var all = tasksOf(state.date);
        renderProgress(all);
        renderFilters();
        renderCatFilters(all);

        var items = visibleTasks(all);
        el.list.innerHTML = '';
        el.list.classList.toggle('hidden', items.length === 0);

        items.forEach(function (task) {
          var node = el.template.content.firstElementChild.cloneNode(true);
          node.dataset.id = task.id;
          node.classList.toggle('done', !!task.done);

          var text = node.querySelector('.task-text');
          text.textContent = task.text;
          if (task.done) {
            text.classList.add('text-muted-foreground');
          }

          var meta = node.querySelector('.task-meta');
          meta.innerHTML = '';

          if (task.cat) {
            var badge = document.createElement('button');
            badge.type = 'button';
            badge.className = 'field task-cat badge px-2 py-0.5 text-xs ' + catClass(task.cat);
            badge.dataset.cat = task.cat;
            badge.setAttribute('aria-label', '筛选「' + catLabel(task.cat) + '」分类');
            badge.textContent = catLabel(task.cat);
            meta.appendChild(badge);
          }

          var dueSlot = document.createElement('span');
          dueSlot.className = 'slot-due inline-flex items-center gap-1.5';
          meta.appendChild(dueSlot);

          if (task.due) {
            var tone = dueTone(task);
            var chip = document.createElement('span');
            chip.className = 'inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-xs tabular-nums';
            if (tone === 'overdue') {
              chip.classList.add('border-danger', 'text-danger', 'font-medium');
              chip.textContent = '截止 ' + dueLabel(task.due) + ' · 已逾期';
            } else if (tone === 'today') {
              chip.classList.add('border-border', 'bg-accent', 'text-accent-foreground', 'font-medium');
              chip.textContent = '截止 今天';
            } else {
              chip.classList.add('border-border', 'text-muted-foreground');
              chip.textContent = '截止 ' + dueLabel(task.due);
            }
            dueSlot.appendChild(chip);
          }

          meta.classList.toggle('hidden', !task.cat && !task.due);

          var toggle = node.querySelector('.toggle');
          toggle.setAttribute('aria-label', task.done ? '标记为未完成' : '标记完成');
          if (task.done) {
            toggle.classList.add('bg-primary', 'border-primary', 'text-primary-foreground');
          } else {
            toggle.classList.add('border-border', 'text-transparent');
          }

          var handle = node.querySelector('.drag');
          handle.disabled = state.filter !== 'all' || state.cat !== 'all';
          if (handle.disabled) {
            handle.classList.add('opacity-25');
            handle.title = '切回「全部」筛选后可拖动排序';
          } else {
            handle.title = '拖动调整顺序，或聚焦后用上下方向键';
          }

          el.list.appendChild(node);
        });

        if (items.length === 0) {
          el.empty.classList.remove('hidden');
          if (all.length === 0) {
            el.emptyTitle.textContent = '今天还没有待办';
            el.emptyDesc.textContent = '在上面的输入框写一条，按回车就能添加';
          } else if (state.cat !== 'all') {
            el.emptyTitle.textContent = '「' + catLabel(state.cat) + '」分类下没有任务';
            el.emptyDesc.textContent = '换一个分类看看，或在添加时选择这个分类';
          } else if (state.filter === 'done') {
            el.emptyTitle.textContent = '还没有完成的事';
            el.emptyDesc.textContent = '把进行中的任务勾选掉，就会出现在这里';
          } else {
            el.emptyTitle.textContent = '进行中的任务已清空';
            el.emptyDesc.textContent = '今天的待办都完成了，可以去看看已完成列表';
          }
        } else {
          el.empty.classList.add('hidden');
        }

        el.clearDone.disabled = all.filter(function (t) { return t.done; }).length === 0;
        el.clearDone.classList.toggle('opacity-40', el.clearDone.disabled);
        el.clearDone.classList.toggle('cursor-not-allowed', el.clearDone.disabled);

        var activeCount = all.filter(function (t) { return !t.done; }).length;
        el.completeAll.disabled = activeCount === 0;
        el.completeAll.classList.toggle('opacity-40', el.completeAll.disabled);
        el.completeAll.classList.toggle('cursor-not-allowed', el.completeAll.disabled);
      }

      function addTask(text, due, cat) {
        var list = tasksOf(state.date);
        list.push({
          id: 't' + Date.now() + Math.random().toString(16).slice(2, 6),
          text: text,
          done: false,
          due: due || null,
          cat: cat || null,
          createdAt: Date.now()
        });
        saveTasks(state.date, list);
        render();
      }

      function updateTask(id, patch) {
        var list = tasksOf(state.date).map(function (t) {
          if (t.id !== id) return t;
          return Object.assign({}, t, patch);
        });
        saveTasks(state.date, list);
        render();
      }

      function removeTask(id) {
        var node = el.list.querySelector('[data-id="' + id + '"]');
        var list = tasksOf(state.date).filter(function (t) { return t.id !== id; });
        saveTasks(state.date, list);
        if (node) {
          node.classList.add('removing');
          setTimeout(render, 160);
        } else {
          render();
        }
      }

      function startEdit(node, task) {
        var holder = node.querySelector('.task-text');
        var input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 120;
        input.value = task.text;
        input.className = 'field w-full h-8 rounded-md border border-input bg-background px-2 text-sm';

        holder.replaceWith(input);
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);

        var finished = false;
        function commit(save) {
          if (finished) return;
          finished = true;
          var next = input.value.trim();
          if (save && next && next !== task.text) {
            updateTask(task.id, { text: next });
          } else {
            render();
          }
        }
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') commit(true);
          if (e.key === 'Escape') commit(false);
        });
        input.addEventListener('blur', function () { commit(true); });
      }

      function startDueEdit(node, task) {
        var meta = node.querySelector('.task-meta');
        meta.classList.remove('hidden');

        var slot = node.querySelector('.slot-due');
        if (!slot) {
          slot = document.createElement('span');
          slot.className = 'slot-due';
          meta.appendChild(slot);
        }
        slot.innerHTML = '';

        var input = document.createElement('input');
        input.type = 'date';
        input.value = task.due || '';
        input.className = 'field h-8 rounded-md border border-input bg-background px-2 text-xs text-foreground';
        input.setAttribute('aria-label', '截止日期');

        var clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.textContent = '清除';
        clearBtn.className = 'field h-8 px-2 rounded-md text-xs text-muted-foreground hover:bg-secondary hover:text-foreground';

        slot.appendChild(input);
        meta.appendChild(clearBtn);
        input.focus();

        var finished = false;
        function commit(value) {
          if (finished) return;
          finished = true;
          updateTask(task.id, { due: value || null });
        }

        input.addEventListener('change', function () { commit(input.value); });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') commit(input.value);
          if (e.key === 'Escape') { finished = true; render(); }
        });
        input.addEventListener('blur', function () {
          setTimeout(function () { if (!finished) commit(input.value); }, 120);
        });
        clearBtn.addEventListener('mousedown', function (e) {
          e.preventDefault();
          commit(null);
        });
      }

      function startCatEdit(node, task) {
        var meta = node.querySelector('.task-meta');
        meta.classList.remove('hidden');

        var slot = document.createElement('span');
        slot.className = 'slot-cat';
        var oldCat = meta.querySelector('.slot-cat');
        if (oldCat) {
          meta.replaceChild(slot, oldCat);
        } else {
          meta.insertBefore(slot, meta.firstChild);
        }
        slot.innerHTML = '';

        var select = document.createElement('select');
        select.className = 'field h-8 rounded-md border border-input bg-background px-2 text-xs text-foreground';
        select.setAttribute('aria-label', '分类');
        CATS.forEach(function (c) {
          var opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.label;
          if (task.cat === c.id) opt.selected = true;
          select.appendChild(opt);
        });
        slot.appendChild(select);
        select.focus();

        var finished = false;
        function commit(value) {
          if (finished) return;
          finished = true;
          updateTask(task.id, { cat: value || null });
        }
        select.addEventListener('change', function () { commit(select.value); });
        select.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') commit(select.value);
          if (e.key === 'Escape') { finished = true; render(); }
        });
        select.addEventListener('blur', function () {
          setTimeout(function () { if (!finished) commit(select.value); }, 120);
        });
      }

      var drag = null;

      function startDrag(e, node) {
        if (state.filter !== 'all' || state.cat !== 'all' || drag) return;
        if (typeof e.button === 'number' && e.button !== 0) return;
        e.preventDefault();

        var rect = node.getBoundingClientRect();
        var ghost = node.cloneNode(true);
        ghost.classList.add('drag-ghost');
        ghost.style.width = rect.width + 'px';
        ghost.style.left = rect.left + 'px';
        ghost.style.top = rect.top + 'px';
        document.body.appendChild(ghost);

        node.classList.add('dragging');
        document.body.classList.add('is-sorting');
        drag = { node: node, ghost: ghost, offsetY: e.clientY - rect.top };

        document.addEventListener('pointermove', onDragMove);
        document.addEventListener('pointerup', endDrag);
        document.addEventListener('pointercancel', endDrag);
      }

      function onDragMove(e) {
        if (!drag) return;
        e.preventDefault();
        drag.ghost.style.top = (e.clientY - drag.offsetY) + 'px';

        if (e.clientY > window.innerHeight - 70) {
          window.scrollBy(0, 14);
        } else if (e.clientY < 70) {
          window.scrollBy(0, -14);
        }

        var hit = document.elementFromPoint(e.clientX, e.clientY);
        var over = hit && hit.closest ? hit.closest('.task-item') : null;
        if (!over || over === drag.node) return;

        var rect = over.getBoundingClientRect();
        var insertBefore = e.clientY < rect.top + rect.height / 2;
        el.list.insertBefore(drag.node, insertBefore ? over : over.nextElementSibling);
      }

      function endDrag() {
        if (!drag) return;
        document.removeEventListener('pointermove', onDragMove);
        document.removeEventListener('pointerup', endDrag);
        document.removeEventListener('pointercancel', endDrag);
        if (drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
        drag.node.classList.remove('dragging');
        document.body.classList.remove('is-sorting');
        drag = null;
        commitOrder();
      }

      function commitOrder() {
        var nodes = el.list.querySelectorAll('.task-item');
        var ids = Array.prototype.map.call(nodes, function (n) { return n.dataset.id; });
        var list = tasksOf(state.date);
        var map = {};
        list.forEach(function (t) { map[t.id] = t; });
        var ordered = [];
        ids.forEach(function (id) { if (map[id]) ordered.push(map[id]); });
        list.forEach(function (t) { if (ids.indexOf(t.id) === -1) ordered.push(t); });
        saveTasks(state.date, ordered);
      }

      el.form.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = el.input.value.trim();
        if (!text) {
          el.input.focus();
          return;
        }
        addTask(text, el.dueInput.value, el.catInput.value);
        el.input.value = '';
        el.dueInput.value = '';
        el.input.focus();
      });

      el.list.addEventListener('click', function (e) {
        var toggle = e.target.closest('.toggle');
        var editBtn = e.target.closest('.edit');
        var dueBtn = e.target.closest('.due-btn');
        var tagBtn = e.target.closest('.tag-btn');
        var removeBtn = e.target.closest('.remove');
        var badge = e.target.closest('.task-cat');
        var node = e.target.closest('.task-item');
        if (!node) return;

        if (badge && badge.dataset.cat) {
          state.cat = badge.dataset.cat;
          render();
          return;
        }

        var id = node.dataset.id;
        var task = tasksOf(state.date).filter(function (t) { return t.id === id; })[0];
        if (!task) return;

        if (toggle) updateTask(id, { done: !task.done });
        if (removeBtn) removeTask(id);
        if (editBtn) startEdit(node, task);
        if (dueBtn) startDueEdit(node, task);
        if (tagBtn) startCatEdit(node, task);
      });

      el.list.addEventListener('dblclick', function (e) {
        var node = e.target.closest('.task-item');
        if (!node || e.target.closest('button')) return;
        var id = node.dataset.id;
        var task = tasksOf(state.date).filter(function (t) { return t.id === id; })[0];
        if (task) startEdit(node, task);
      });

      el.list.addEventListener('pointerdown', function (e) {
        var handle = e.target.closest('.drag');
        if (!handle) return;
        var node = handle.closest('.task-item');
        if (!node) return;
        startDrag(e, node);
      });

      el.list.addEventListener('keydown', function (e) {
        var handle = e.target.closest('.drag');
        if (!handle) return;
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        if (state.filter !== 'all' || state.cat !== 'all') return;
        var node = handle.closest('.task-item');
        if (e.key === 'ArrowUp' && node.previousElementSibling) {
          el.list.insertBefore(node, node.previousElementSibling);
        } else if (e.key === 'ArrowDown' && node.nextElementSibling) {
          el.list.insertBefore(node.nextElementSibling, node);
        } else {
          return;
        }
        e.preventDefault();
        handle.focus();
        commitOrder();
      });

      el.filters.addEventListener('click', function (e) {
        var btn = e.target.closest('.filter-btn');
        if (!btn) return;
        state.filter = btn.getAttribute('data-filter');
        render();
      });

      el.catFilters.addEventListener('click', function (e) {
        var chip = e.target.closest('.cat-chip');
        if (!chip) return;
        state.cat = chip.dataset.cat;
        render();
      });

      el.clearDone.addEventListener('click', function () {
        if (el.clearDone.disabled) return;
        var list = tasksOf(state.date).filter(function (t) { return !t.done; });
        saveTasks(state.date, list);
        render();
      });

      el.completeAll.addEventListener('click', function () {
        if (el.completeAll.disabled) return;
        var list = tasksOf(state.date).map(function (t) {
          return t.done ? t : Object.assign({}, t, { done: true });
        });
        saveTasks(state.date, list);
        render();
      });

      function shiftDay(offset) {
        var d = fromKey(state.date);
        d.setDate(d.getDate() + offset);
        state.date = toKey(d);
        render();
      }

      el.prevDay.addEventListener('click', function () { shiftDay(-1); });
      el.nextDay.addEventListener('click', function () { shiftDay(1); });
      el.todayJump.addEventListener('click', function () {
        state.date = toKey(new Date());
        render();
      });

      render();
      el.input.focus();
    })();
  </script>
  <!-- ===== APP-JS:END ===== -->
</body>
